<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>🧬 BioGame – Vote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --border: #1e2d4a;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --purple: #a855f7;
      --text: #f0f4ff;
      --muted: #6b7280;
      --opt-a: #3b82f6;
      --opt-b: #a855f7;
      --opt-c: #f59e0b;
      --opt-d: #ec4899;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    #header {
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #header .logo { font-weight: 900; font-size: 1.1rem; }
    #header .logo span { color: var(--accent); }
    #group-chip {
      background: rgba(59,130,246,.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 14px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    /* ── MAIN ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      gap: 10px;
      overflow: hidden;
    }

    #milestone-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--purple);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    #question-text {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      flex-shrink: 0;
    }

    /* Vote buttons */
    #vote-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex: 1;
    }
    .vote-btn {
      border-radius: 16px;
      border: 2.5px solid;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s, background 0.2s, opacity 0.3s;
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
      min-height: 80px;
    }
    .vote-btn:active { transform: scale(0.95); }
    .vote-btn .label {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 900;
    }
    .vote-btn .txt { font-size: 0.9rem; font-weight: 600; text-align: center; line-height: 1.3; }

    .vote-btn.A { border-color: var(--opt-a); }
    .vote-btn.B { border-color: var(--opt-b); }
    .vote-btn.C { border-color: var(--opt-c); }
    .vote-btn.D { border-color: var(--opt-d); }
    .vote-btn.A .label { background: rgba(59,130,246,.2); color: var(--opt-a); }
    .vote-btn.B .label { background: rgba(168,85,247,.2); color: var(--opt-b); }
    .vote-btn.C .label { background: rgba(245,158,11,.2); color: var(--opt-c); }
    .vote-btn.D .label { background: rgba(236,72,153,.2); color: var(--opt-d); }

    .vote-btn.selected.A { background: rgba(59,130,246,.25); box-shadow: 0 0 20px rgba(59,130,246,.4); }
    .vote-btn.selected.B { background: rgba(168,85,247,.25); box-shadow: 0 0 20px rgba(168,85,247,.4); }
    .vote-btn.selected.C { background: rgba(245,158,11,.25); box-shadow: 0 0 20px rgba(245,158,11,.4); }
    .vote-btn.selected.D { background: rgba(236,72,153,.25); box-shadow: 0 0 20px rgba(236,72,153,.4); }
    .vote-btn.disabled { opacity: 0.3; pointer-events: none; }

    /* ── STATUS STRIP ── */
    #status-strip {
      flex-shrink: 0;
      padding: 10px 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }
    #status-strip.waiting { color: var(--yellow); }
    #status-strip.correct { color: var(--green); }
    #status-strip.wrong   { color: var(--red); }

    /* ── GROUP PICKER OVERLAY ── */
    #group-picker {
      position: fixed; inset: 0;
      background: rgba(10,14,26,.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 99;
      padding: 24px;
    }
    #group-picker h2 { font-size: 1.6rem; font-weight: 900; text-align: center; }
    #group-picker p  { color: var(--muted); font-size: 0.9rem; text-align: center; }
    #group-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 300px; }
    .grp-btn {
      padding: 20px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.1s;
    }
    .grp-btn:hover { border-color: var(--accent); background: rgba(59,130,246,.15); }
    .grp-btn:active { transform: scale(0.94); }

    /* ── WAITING SCREEN ── */
    #waiting-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 24px;
      z-index: 90;
    }
    #waiting-screen .big-icon { font-size: 4rem; animation: pulse-icon 1.5s ease-in-out infinite; }
    @keyframes pulse-icon {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.1); opacity: 0.7; }
    }
    #waiting-screen h3 { font-size: 1.4rem; font-weight: 900; }
    #waiting-screen p  { color: var(--muted); font-size: 0.9rem; }
    #waiting-voted-ans { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }

    /* Result banner */
    #result-banner {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
      z-index: 95;
    }
    #result-banner.correct-bg { background: radial-gradient(ellipse at 50% 50%, rgba(34,197,94,.25) 0%, var(--bg) 70%); }
    #result-banner.wrong-bg   { background: radial-gradient(ellipse at 50% 50%, rgba(239,68,68,.2) 0%, var(--bg) 70%); }
    #result-banner .res-icon  { font-size: 5rem; }
    #result-banner h3         { font-size: 1.8rem; font-weight: 900; }
    #result-banner p          { color: var(--muted); font-size: 0.95rem; }
    #result-banner .correct-ans-label { font-size: 1rem; font-weight: 700; color: var(--green); }

    /* lobby / milestone / gameover message */
    #info-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 32px;
    }
    #info-screen .big { font-size: 3.5rem; }
    #info-screen h3   { font-size: 1.5rem; font-weight: 900; }
    #info-screen p    { color: var(--muted); font-size: 0.9rem; line-height: 1.6; }

    /* ── TIMER BAR ── */
    #timer-bar-wrap {
      height: 6px; background: #1f2937;
      position: relative; overflow: hidden; flex-shrink: 0;
    }
    #timer-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      transition: width 0.95s linear, background 0.3s;
      width: 100%;
    }
    #timer-bar-wrap.danger #timer-bar-fill {
      background: linear-gradient(90deg, #ef4444, #f97316);
      animation: bar-flash 0.4s ease-in-out infinite alternate;
    }
    @keyframes bar-flash {
      from { opacity: 1; } to { opacity: 0.5; }
    }
    #timer-label {
      text-align: center; font-size: 0.8rem; font-weight: 700;
      color: var(--muted); padding: 2px 0;
      flex-shrink: 0;
    }
    #timer-label.danger { color: var(--red); }
  </style>
</head>
<body>

<div id="header">
  <div class="logo">🧬 <span>Bio</span>Game</div>
  <div id="group-chip" onclick="changeGroup()">Group <span id="group-num">?</span> <small style="opacity:0.7;font-weight:400">(Change)</small></div>
</div>

<!-- Timer bar -->
<div id="timer-bar-wrap"><div id="timer-bar-fill"></div></div>
<div id="timer-label">⏱ 10s</div>

<div id="main">
  <div id="milestone-tag"></div>
  <div id="question-text">Waiting for the host to start…</div>
  <div id="vote-grid">
    <button class="vote-btn A" id="vbtn-A" onclick="vote('A')">
      <div class="label">A</div>
      <div class="txt" id="vtxt-A"></div>
    </button>
    <button class="vote-btn B" id="vbtn-B" onclick="vote('B')">
      <div class="label">B</div>
      <div class="txt" id="vtxt-B"></div>
    </button>
    <button class="vote-btn C" id="vbtn-C" onclick="vote('C')">
      <div class="label">C</div>
      <div class="txt" id="vtxt-C"></div>
    </button>
    <button class="vote-btn D" id="vbtn-D" onclick="vote('D')">
      <div class="label">D</div>
      <div class="txt" id="vtxt-D"></div>
    </button>
  </div>
  <div id="status-strip">Pick an answer above!</div>
</div>

<!-- Group picker overlay -->
<div id="group-picker">
  <h2>👋 Pick Your Group!</h2>
  <p>Each group selects once. Your choice is saved on this device.</p>
  <div id="group-buttons">
    <button class="grp-btn" onclick="selectGroup(1)">Group 1</button>
    <button class="grp-btn" onclick="selectGroup(2)">Group 2</button>
    <button class="grp-btn" onclick="selectGroup(3)">Group 3</button>
    <button class="grp-btn" onclick="selectGroup(4)">Group 4</button>
    <button class="grp-btn" onclick="selectGroup(5)">Group 5</button>
    <button class="grp-btn" onclick="selectGroup(6)">Group 6</button>
    <button class="grp-btn" onclick="selectGroup(7)">Group 7</button>
    <button class="grp-btn" onclick="selectGroup(8)">Group 8</button>
    <button class="grp-btn" onclick="selectGroup(9)">Group 9</button>
  </div>
</div>

<!-- Waiting screen (after vote submitted) -->
<div id="waiting-screen">
  <div class="big-icon">⏳</div>
  <h3>Vote Locked In!</h3>
  <div id="waiting-voted-ans"></div>
  <p>Waiting for the host to reveal the answer…</p>
</div>

<!-- Result banner (after reveal) -->
<div id="result-banner">
  <div class="res-icon" id="res-icon"></div>
  <h3 id="res-title"></h3>
  <p id="res-sub"></p>
  <div class="correct-ans-label" id="res-correct-ans"></div>
</div>

<!-- Info screen for lobby / milestone / gameover -->
<div id="info-screen">
  <div class="big" id="info-icon"></div>
  <h3 id="info-title"></h3>
  <p id="info-sub"></p>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

// ── Timer bar ──
const TIMER_MAX_V = 10;
const timerBarWrap  = document.getElementById('timer-bar-wrap');
const timerBarFill  = document.getElementById('timer-bar-fill');
const timerLabelEl  = document.getElementById('timer-label');

function setTimerBar(secs) {
  const s = Math.max(0, secs);
  timerBarFill.style.width = (s / TIMER_MAX_V * 100) + '%';
  timerLabelEl.textContent = s > 0 ? `⏱ ${s}s` : '';
  if (s <= 3 && s > 0) {
    timerBarWrap.classList.add('danger');
    timerLabelEl.classList.add('danger');
  } else {
    timerBarWrap.classList.remove('danger');
    timerLabelEl.classList.remove('danger');
  }
  timerBarWrap.style.opacity = s === 0 ? '0' : '1';
  timerLabelEl.style.opacity = s === 0 ? '0' : '1';
}

socket.on('timer:tick', ({ seconds }) => setTimerBar(seconds));

let myGroupId = localStorage.getItem('biogame-group');
let myVote = null;
let currentPhase = null;
let currentQIndex = -1;

// Show/hide group picker
if (myGroupId) {
  document.getElementById('group-picker').style.display = 'none';
  document.getElementById('group-num').textContent = myGroupId;
} else {
  document.getElementById('group-picker').style.display = 'flex';
}

function selectGroup(n) {
  myGroupId = String(n);
  localStorage.setItem('biogame-group', myGroupId);
  document.getElementById('group-num').textContent = n;
  document.getElementById('group-picker').style.display = 'none';
}
function changeGroup() {
  localStorage.removeItem('biogame-group');
  myGroupId = null;
  myVote = null;
  document.getElementById('group-picker').style.display = 'flex';
}

function vote(ans) {
  if (!myGroupId) { document.getElementById('group-picker').style.display = 'flex'; return; }
  if (myVote) return;
  myVote = ans;
  socket.emit('group:vote', { groupId: myGroupId, answer: ans });
  showWaiting(ans);
}

function showWaiting(ans) {
  document.getElementById('waiting-screen').style.display = 'flex';
  document.getElementById('waiting-voted-ans').innerHTML =
    `Your vote: <strong style="color:var(--accent)">${ans}</strong>`;
}

socket.on('state:update', (s) => {
  const phaseChanged  = s.phase !== currentPhase;
  const questionChanged = s.questionIndex !== currentQIndex;

  // Reset vote on new question
  if (questionChanged) {
    myVote = null;
  }
  currentPhase  = s.phase;
  currentQIndex = s.questionIndex;

  // Info screen for non-playing phases
  const infoScreen   = document.getElementById('info-screen');
  const waitingScreen = document.getElementById('waiting-screen');
  const resultBanner  = document.getElementById('result-banner');

  // Show/hide screens by phase
  infoScreen.style.display    = 'none';
  waitingScreen.style.display = 'none';
  resultBanner.style.display  = 'none';

  if (s.phase === 'lobby') {
    infoScreen.style.display = 'flex';
    document.getElementById('info-icon').textContent = '🧬';
    document.getElementById('info-title').textContent = 'Waiting for Host…';
    document.getElementById('info-sub').textContent  = 'The game hasn\'t started yet. Stand by!';
    return;
  }

  if (s.phase === 'milestone') {
    infoScreen.style.display = 'flex';
    document.getElementById('info-icon').textContent = '🎉';
    document.getElementById('info-title').textContent = 'Milestone Reached!';
    document.getElementById('info-sub').textContent = 'The baby is evolving! Watch the big screen.';
    return;
  }

  if (s.phase === 'gameover') {
    infoScreen.style.display = 'flex';
    document.getElementById('info-icon').textContent = '🎊';
    document.getElementById('info-title').textContent = 'Game Over! Baby Delivered!';
    document.getElementById('info-sub').textContent =
      `Final Score: ✅ ${s.score.correct}  ❌ ${s.score.wrong}  ❤️ ${s.health} HP`;
    return;
  }

  if (s.phase === 'revealed') {
    resultBanner.style.display = 'flex';
    resultBanner.className = s.correct ? 'correct-bg' : 'wrong-bg';
    document.getElementById('res-icon').textContent  = s.correct ? '🎉' : '😬';
    document.getElementById('res-title').textContent = s.correct ? 'Class Got It Right!' : 'Not Quite…';
    const delta = s.correct ? '+10 HP' : '-15 HP';
    document.getElementById('res-sub').textContent = s.correct
      ? `Majority voted ${s.majorityAnswer || '—'} — correct! ${delta}`
      : `Majority voted ${s.majorityAnswer || '—'} — the answer was ${s.correctAnswer}. ${delta}`;
    document.getElementById('res-correct-ans').textContent =
      s.correctAnswer ? `✅ Correct Answer: ${s.correctAnswer}` : '';
    return;
  }

  // Phase = question
  if (s.phase === 'question') {
    if (myVote) {
      waitingScreen.style.display = 'flex';
      document.getElementById('waiting-voted-ans').innerHTML =
        `Your vote: <strong style="color:var(--accent)">${myVote}</strong>`;
    }
    // Always update question text
    if (s.question) {
      document.getElementById('milestone-tag').textContent = s.question.milestoneLabel || '';
      document.getElementById('question-text').textContent = s.question.text;
      ['A','B','C','D'].forEach(opt => {
        document.getElementById('vtxt-' + opt).textContent = s.question.options[opt];
        const btn = document.getElementById('vbtn-' + opt);
        btn.classList.remove('selected','disabled');
        if (myVote && myVote === opt) btn.classList.add('selected');
        if (myVote && myVote !== opt) btn.classList.add('disabled');
      });
    }
    const strip = document.getElementById('status-strip');
    if (myVote) {
      strip.textContent = `Voted ${myVote} — waiting for reveal…`;
      strip.className = 'waiting';
    } else {
      strip.textContent = `Groups voted: ${s.groupsVoted} / 9`;
      strip.className = '';
    }
  }
});
</script>
</body>
</html>
